# Eval set для Хроника — версия 1.0 (15 вопросов)
#
# Формат каждого кейса:
#   id: уникальный идентификатор
#   query: вопрос пользователя
#   expected_mode: режим который должен выбрать роутер
#   required_keywords: слова/фразы которые ДОЛЖНЫ присутствовать в answer
#   forbidden_keywords: слова/фразы которые НЕ должны присутствовать (галлюцинации)
#   min_facts: минимальное количество facts[] в ответе
#   require_sources: true если каждый fact должен иметь валидный source
#   notes: комментарий для ревьюера

cases:

  # --- SEARCH mode (5 кейсов) ---

  - id: search_001
    query: "Что мы знаем про агентский кабинет для продавцов?"
    expected_mode: search
    required_keywords: []
    forbidden_keywords: ["не знаю", "нет информации"]
    min_facts: 1
    require_sources: true
    notes: "Базовый поиск по конкретной фиче. Проверяем что возвращает факты с источниками."

  - id: search_002
    query: "Какова стратегия по сегменту SMB на 2025 год?"
    expected_mode: search
    required_keywords: []
    forbidden_keywords: []
    min_facts: 1
    require_sources: true
    notes: "Поиск стратегии по сегменту. Если документа нет — должен сказать явно."

  - id: search_003
    query: "Какие ключевые метрики отслеживает команда продавцов?"
    expected_mode: search
    required_keywords: []
    forbidden_keywords: []
    min_facts: 0
    require_sources: false
    notes: "Широкий вопрос о метриках. Проверяем что не придумывает цифры из воздуха."

  - id: search_004
    query: "Что такое листинговая воронка и как она работает?"
    expected_mode: search
    required_keywords: []
    forbidden_keywords: []
    min_facts: 0
    require_sources: false
    notes: "Термин из предметной области Avito. Если не найдено — честный ответ."

  - id: search_005
    query: "Расскажи про опыт пользователей при первой публикации объявления"
    expected_mode: search
    required_keywords: []
    forbidden_keywords: []
    min_facts: 0
    require_sources: false
    notes: "Customer journey тема. Проверяем relevance ответа."

  # --- CONTRADICTIONS mode (3 кейса) ---

  - id: contra_001
    query: "Покажи расхождения в цифрах по выручке между документами"
    expected_mode: contradictions
    required_keywords: []
    forbidden_keywords: []
    min_facts: 0
    require_sources: false
    notes: "Явный запрос расхождений. Должен активировать contradictions mode."

  - id: contra_002
    query: "В одном документе написано 12 млрд, в другом 14 млрд — кто прав?"
    expected_mode: contradictions
    required_keywords: []
    forbidden_keywords: []
    min_facts: 0
    require_sources: false
    notes: "Естественная формулировка конфликта. Проверяем mode detection."

  - id: contra_003
    query: "Разные документы называют разные приоритеты — что актуально?"
    expected_mode: contradictions
    required_keywords: []
    forbidden_keywords: []
    min_facts: 0
    require_sources: false
    notes: "Качественное расхождение (не числовое). Проверяем warnings секцию."

  # --- PROMISES mode (2 кейса) ---

  - id: promises_001
    query: "Что команда обещала сделать до конца Q2 2025?"
    expected_mode: promises
    required_keywords: []
    forbidden_keywords: []
    min_facts: 0
    require_sources: false
    notes: "Конкретный дедлайн в запросе. Должен выбрать promises mode."

  - id: promises_002
    query: "Какие задачи из прошлых стратегий так и не были выполнены?"
    expected_mode: promises
    required_keywords: []
    forbidden_keywords: []
    min_facts: 0
    require_sources: false
    notes: "Запрос на просроченные обещания. Проверяем warnings о просроченных."

  # --- GAPS mode (2 кейса) ---

  - id: gaps_001
    query: "Что упустили в текущей стратегии по работе с новыми продавцами?"
    expected_mode: gaps
    required_keywords: []
    forbidden_keywords: []
    min_facts: 0
    require_sources: false
    notes: "Явный gaps запрос. Проверяем requires_verification секцию."

  - id: gaps_002
    query: "Какие риски не закрыты в плане на следующий квартал?"
    expected_mode: gaps
    required_keywords: []
    forbidden_keywords: []
    min_facts: 0
    require_sources: false
    notes: "Риски = gaps по сути. Проверяем mode routing."

  # --- VALIDATE mode (2 кейса) ---

  - id: validate_001
    query: "Оцени инициативу: запустить программу лояльности для топ-100 продавцов SMB"
    expected_mode: validate
    required_keywords: []
    forbidden_keywords: []
    min_facts: 0
    require_sources: false
    notes: "Явная оценка инициативы. Должен роутить в initiative_review."

  - id: validate_002
    query: "Стоит ли делать отдельное мобильное приложение для B2B продавцов?"
    expected_mode: validate
    required_keywords: []
    forbidden_keywords: []
    min_facts: 0
    require_sources: false
    notes: "Неявная validate-формулировка. Проверяем что роутер её улавливает."

  # --- ROBUSTNESS (1 кейс) ---

  - id: robust_001
    query: "какой сегодня день"
    expected_mode: search
    required_keywords: []
    forbidden_keywords: []
    min_facts: 0
    require_sources: false
    notes: "Нерелевантный запрос. Должен вернуть честный ответ о пустом корпусе, без выдумок."
